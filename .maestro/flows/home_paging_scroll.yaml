appId: com.lfgtavora.poketcg.demo
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "home_sets_grid"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "set_card_.*"
      index: 0
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "home_set_pos_10"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "home_sets_grid"
